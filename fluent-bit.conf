[SERVICE]
    Flush        5
    Log_Level    info

[INPUT]
    Name          opentelemetry
    Listen        0.0.0.0
    Port          4318

[OUTPUT]
    Name          opentelemetry
    Match         *
    Host          ${LANGFUSE_HOST}
    Port          443
    Traces_Uri    /api/public/otel/v1/traces
    TLS           On
    TLS.Verify    On
    Header        Authorization Basic ${LANGFUSE_AUTH}